[project]
name = "redis-kit"
version = "0.1.0"
description = "Enterprise-grade Python Redis toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Xinzz", email = "765333437@qq.com" },
]
keywords = ["redis", "cache", "distributed-lock", "queue", "bloom-filter", "session"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "redis>=7.4.0",
]

[project.urls]
Homepage = "https://github.com/Xinzz995/redis-kit"
Repository = "https://github.com/Xinzz995/redis-kit"
Issues = "https://github.com/Xinzz995/redis-kit/issues"

[project.optional-dependencies]
msgpack = ["msgpack>=1.0"]
lz4 = ["lz4>=4.0"]
zstd = ["zstandard>=0.20"]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
all = ["redis-kit[msgpack,lz4,zstd,otel]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "fakeredis[lua]>=2.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
