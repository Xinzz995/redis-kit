services:
  # Standalone Redis (port 6379)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Sentinel master (port 6380)
  redis-master:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Sentinel (port 26379)
  redis-sentinel:
    image: redis:7-alpine
    ports:
      - "26379:26379"
    depends_on:
      redis-master:
        condition: service_healthy
    entrypoint: ["sh", "-c", "echo 'sentinel monitor mymaster redis-master 6379 1\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 10000' > /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cluster nodes (ports 7001-7003) — use host network for proper cluster gossip
  redis-node-1:
    image: redis:7-alpine
    network_mode: host
    command: redis-server --port 7001 --cluster-enabled yes --cluster-config-file /tmp/nodes1.conf --cluster-node-timeout 5000
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7001", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node-2:
    image: redis:7-alpine
    network_mode: host
    command: redis-server --port 7002 --cluster-enabled yes --cluster-config-file /tmp/nodes2.conf --cluster-node-timeout 5000
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7002", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node-3:
    image: redis:7-alpine
    network_mode: host
    command: redis-server --port 7003 --cluster-enabled yes --cluster-config-file /tmp/nodes3.conf --cluster-node-timeout 5000
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7003", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  cluster-init:
    image: redis:7-alpine
    network_mode: host
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
    entrypoint: ["sh", "-c", "echo yes | redis-cli --cluster create 127.0.0.1:7001 127.0.0.1:7002 127.0.0.1:7003 --cluster-replicas 0 && echo Cluster created"]
    restart: "no"
