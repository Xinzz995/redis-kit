site_name: redis-py-kit
site_url: https://xinzz995.github.io/redis-kit/
site_description: Enterprise-grade Python Redis toolkit with sync/async dual-mode APIs
repo_url: https://github.com/Xinzz995/redis-kit
repo_name: Xinzz995/redis-kit

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Modules:
      - Cache: modules/cache.md
      - Tiered Cache: modules/tiered-cache.md
      - Distributed Lock: modules/lock.md
      - Queue: modules/queue.md
      - Redis Streams: modules/streams.md
      - Bloom Filter: modules/bloom.md
      - Counter & ID Generator: modules/counter.md
      - Session Manager: modules/session.md
      - Rate Limiter: modules/ratelimit.md
      - Repository: modules/repository.md
      - Observability: modules/observability.md
  - Configuration:
      - Topology: configuration/topology.md
      - Serialization: configuration/serialization.md
      - Exception Handling: configuration/exceptions.md
  - Changelog: changelog.md

docs_dir: site-docs

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
