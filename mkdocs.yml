site_name: redis-py-kit
site_url: https://xinzz995.github.io/redis-kit/
site_description: 企业级 Python Redis 工具库，支持同步/异步双模 API
repo_url: https://github.com/Xinzz995/redis-kit
repo_name: Xinzz995/redis-kit

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.highlight

nav:
  - 首页: index.md
  - 快速入门:
      - 安装: getting-started/installation.md
      - 快速开始: getting-started/quickstart.md
  - 核心模块:
      - 缓存: modules/cache.md
      - 多级缓存: modules/tiered-cache.md
      - 分布式锁: modules/lock.md
      - 消息队列: modules/queue.md
      - Redis Streams: modules/streams.md
      - 布隆过滤器: modules/bloom.md
      - 计数器与 ID 生成器: modules/counter.md
      - Session 管理: modules/session.md
      - 限流器: modules/ratelimit.md
      - Repository: modules/repository.md
      - 可观测性: modules/observability.md
  - 配置:
      - 拓扑支持: configuration/topology.md
      - 序列化与压缩: configuration/serialization.md
      - 异常处理: configuration/exceptions.md
  - 更新日志: changelog.md

docs_dir: site-docs

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
